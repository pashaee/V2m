name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v2.0.3)'
        required: true
        default: 'v2.0.3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/v2m-key.jks

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Sign Release APK
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/v2m-key.jks -Pandroid.injected.signing.store.password=${{ secrets.KEY_PASSWORD }} -Pandroid.injected.signing.key.alias=key0 -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: app/build/outputs/apk/**/*.apk
